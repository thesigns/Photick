<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Spin the wheel, get a photo topic, go out and shoot it.">
  <meta name="apple-mobile-web-app-title" content="Photick">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Photick</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Home: your current topic -->
  <section id="home" class="screen">
    <header class="bar">
      <span class="brand">photick<span class="brand-dot">.</span></span>
      <button class="lang" type="button">PL</button>
    </header>

    <div class="today">
      <p id="date" class="date"></p>
      <p id="topic-label" class="label">your topic</p>
      <h1 id="topic" class="topic">…</h1>
      <p id="topic-hint" class="topic-hint"></p>
      <p id="topic-meta" class="meta"></p>
      <p id="home-note" class="note" hidden></p>
    </div>

    <footer class="actions">
      <button id="take" class="primary" type="button" disabled>Take a photo</button>
      <button id="spin-again" class="secondary" type="button" hidden>Spin the wheel</button>
      <p id="next-spin" class="footnote" hidden></p>
    </footer>
  </section>

  <!-- The wheel: a slice of a huge wheel with all the topics left -->
  <section id="wheel-screen" class="screen" hidden>
    <header class="bar">
      <div class="bar-slot">
        <button id="wheel-back" class="icon" type="button" aria-label="Back" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <button class="lang" type="button">PL</button>
    </header>

    <div class="wheel-head">
      <p id="wheel-label" class="label">spin the wheel</p>
      <p id="wheel-count" class="meta"></p>
    </div>

    <div id="wheel" class="wheel" aria-hidden="true"></div>

    <footer class="actions">
      <p id="wheel-hint" class="footnote"></p>
      <button id="spin" class="primary" type="button">Spin</button>
    </footer>
  </section>

  <!-- Preview: the photo with its topic, ready to share -->
  <section id="preview" class="screen" hidden>
    <header class="bar">
      <button id="close" class="icon" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="preview-body">
      <img id="photo" class="photo" alt="Your photo">
      <div class="caption">
        <p id="preview-date" class="label"></p>
        <p id="preview-topic" class="caption-topic"></p>
      </div>
      <p id="note" class="note" role="status" hidden></p>
    </div>

    <footer class="actions two">
      <button id="retake" class="secondary" type="button">Retake</button>
      <button id="share" class="primary" type="button">Share</button>
    </footer>
  </section>

  <!-- The phone's own camera, at full quality -->
  <input id="camera" type="file" accept="image/*" capture="environment" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
